name: 发布 macOS 安装包

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要补发的现有版本标签，例如 v3.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # 固定与本机正式构建相同的工具链，避免 SwiftUI 随 GitHub 默认 SDK 改变外观。
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: 获取代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: 确认固定构建环境
        run: |
          xcodebuild -version
          swift --version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"

      - name: 校验版本标签
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="${{ inputs.tag }}"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本标签必须是 v3.0.1 这样的格式"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: 运行测试
        run: swift test --disable-sandbox

      - name: 构建 Universal 安装包
        run: |
          APP_BUILD=$((1000 + GITHUB_RUN_NUMBER)) ./scripts/build-app.sh release

      - name: 生成完整性校验文件
        run: |
          cd dist
          shasum -a 256 "牛马日历-macOS-Universal.zip" > "牛马日历-macOS-Universal.zip.sha256"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/牛马日历-macOS-Universal.zip" \
            "dist/牛马日历-macOS-Universal.zip.sha256" \
            --verify-tag \
            --title "牛马日历 $APP_VERSION" \
            --generate-notes
